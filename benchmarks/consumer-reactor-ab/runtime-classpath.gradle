gradle.projectsEvaluated {
    // The init script is also applied to Kafka's included api-checker build.
    def clientsProject = gradle.rootProject.findProject(':clients')
    if (clientsProject == null) {
        return
    }
    clientsProject.tasks.register('copyReactorAbRuntimeClasspath', Copy) {
        dependsOn clientsProject.tasks.named('jar')
        from clientsProject.configurations.runtimeClasspath
        from clientsProject.tasks.named('jar').flatMap { it.archiveFile }
        into providers.gradleProperty('reactorAbLibDir').get()
    }
}
