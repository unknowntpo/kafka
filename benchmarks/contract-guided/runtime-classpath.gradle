// Applied without changing the baseline checkout. Export exact resolved classpaths;
// do not let a wildcard silently load a client jar from another worktree.
gradle.projectsEvaluated {
    def toolsProject = rootProject.findProject(':tools')
    if (toolsProject == null) {
        return
    }
    rootProject.tasks.register('contractGuidedRuntime') {
        def selected = [clients: rootProject.project(':clients'), tools: toolsProject]
        if (providers.gradleProperty('contractGuidedBroker').orElse('false').get() == 'true') {
            selected.broker = rootProject.project(':core')
        }
        selected.each { label, project ->
            dependsOn project.tasks.named('classes')
            dependsOn project.sourceSets.main.runtimeClasspath
            def releaseLibraries = project.configurations.findByName('releaseOnly')
            if (releaseLibraries != null) {
                dependsOn releaseLibraries
            }
        }
        doLast {
            def output = file(providers.gradleProperty('contractGuidedOutput').get())
            output.mkdirs()
            def noSourceOutputs = []
            rootProject.allprojects.each { dependency ->
                def compileJava = dependency.tasks.findByName('compileJava')
                if (compileJava instanceof org.gradle.api.tasks.compile.JavaCompile && compileJava.source.files.empty) {
                    noSourceOutputs.add(compileJava.destinationDirectory.get().asFile.canonicalPath)
                }
                def resources = dependency.tasks.findByName('processResources')
                if (resources instanceof org.gradle.language.jvm.tasks.ProcessResources && resources.source.files.empty) {
                    noSourceOutputs.add(resources.destinationDir.canonicalPath)
                }
            }
            selected.each { label, project ->
                // The distribution supplies the SLF4J binding through releaseOnly, not
                // runtimeClasspath. Match that runtime rather than silently measuring NOP logging.
                def releaseLibraries = project.configurations.findByName('releaseOnly')
                def runtimeFiles = (project.sourceSets.main.runtimeClasspath.files +
                    (releaseLibraries == null ? [] : releaseLibraries.files)).toSet().findAll { path ->
                    if (path.exists()) {
                        return true
                    }
                    // Gradle also lists Java output for the Scala-only core project.
                    // Omit only an output whose producing task demonstrably has NO-SOURCE.
                    if (noSourceOutputs.contains(path.canonicalPath)) {
                        return false
                    }
                    throw new GradleException("Missing runtime entry: ${path}")
                }
                new File(output, "${label}-classpath.txt").text =
                    runtimeFiles.collect { it.canonicalPath }.join(File.pathSeparator)
            }
        }
    }
}
