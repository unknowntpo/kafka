<svg viewBox="0 0 1040 480" xmlns="http://www.w3.org/2000/svg" font-family="Calibri,'Helvetica Neue',Arial,'PingFang TC','Microsoft JhengHei',sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#185FA5"/>
    </marker>
  </defs>

  <text x="30" y="34" font-size="19" font-weight="700" fill="#1E2024">① client ↔ broker　協商：取交集、挑最高版</text>

  <text x="360" y="56" font-size="16" font-weight="700" fill="#27500A">交集 = [v4, v11]　→ 挑最大 = v11</text>

  <rect x="150" y="72" width="495" height="28" rx="4" fill="#FAC775" stroke="#BA7517"/>
  <text x="160" y="92" font-size="15" fill="#633806">client 能力 v0–v11（Kafka 2.4 client）</text>
  <rect x="330" y="106" width="630" height="28" rx="4" fill="#B5D4F4" stroke="#185FA5"/>
  <text x="342" y="126" font-size="15" fill="#0C447C">broker 能力 v4–v18（4.1 broker，validVersions 4–18）</text>

  <line x1="645" y1="64" x2="645" y2="156" stroke="#3B6D11" stroke-width="2" stroke-dasharray="4 3"/>
  <circle cx="645" cy="64" r="6" fill="#27500A"/>

  <line x1="150" y1="160" x2="960" y2="160" stroke="#8A8A8A" stroke-width="1"/>
  <g font-size="13.5" fill="#5F5E5A" text-anchor="middle">
    <line x1="150" y1="155" x2="150" y2="165" stroke="#8A8A8A"/><text x="150" y="182">v0</text>
    <line x1="330" y1="155" x2="330" y2="165" stroke="#8A8A8A"/><text x="330" y="182">v4</text>
    <line x1="645" y1="155" x2="645" y2="165" stroke="#8A8A8A"/><text x="645" y="182">v11</text>
    <line x1="960" y1="155" x2="960" y2="165" stroke="#8A8A8A"/><text x="960" y="182">v18</text>
  </g>
  <text x="330" y="202" font-size="12.5" fill="#8A8A8A" text-anchor="middle">↑ broker 下界</text>
  <text x="960" y="202" font-size="12.5" fill="#8A8A8A" text-anchor="middle">broker 上界 ↑</text>
  <text x="430" y="224" font-size="12.5" fill="#993C1D">更舊的 client（上限 &lt; v4）→ 交集空 → UnsupportedVersionException（abort）</text>

  <text x="30" y="266" font-size="19" font-weight="700" fill="#1E2024">② replica fetch（follower → leader，partition replication）</text>
  <text x="30" y="290" font-size="15" fill="#1E2024">不協商 → 由 finalized MV 決定單一版本（不像 ① 取交集最高，而是照 MV 指定那一版）</text>

  <rect x="330" y="300" width="630" height="28" rx="4" fill="#B5D4F4" stroke="#185FA5"/>
  <text x="342" y="320" font-size="15" fill="#0C447C">broker 能力 v4–v18</text>

  <line x1="150" y1="352" x2="960" y2="352" stroke="#8A8A8A" stroke-width="1"/>
  <g font-size="13.5" fill="#5F5E5A" text-anchor="middle">
    <line x1="330" y1="347" x2="330" y2="357" stroke="#8A8A8A"/><text x="330" y="374">v4</text>
    <line x1="915" y1="347" x2="915" y2="357" stroke="#8A8A8A"/><text x="915" y="374">v17</text>
    <line x1="960" y1="347" x2="960" y2="357" stroke="#8A8A8A"/><text x="960" y="374">v18</text>
  </g>

  <line x1="915" y1="270" x2="915" y2="298" stroke="#185FA5" stroke-width="2.5" marker-end="url(#ar)"/>
  <rect x="780" y="244" width="252" height="26" rx="4" fill="#E6F1FB"/>
  <text x="792" y="262" font-size="15" font-weight="700" fill="#0C447C">finalized MV = 4.1-IV1 → v17</text>

  <rect x="30" y="410" width="980" height="46" rx="4" fill="#E9F3DE"/>
  <text x="48" y="439" font-size="16" fill="#27500A">同一支 Fetch：左邊挑交集上界 v11、右邊由 finalized MV 決定 v17 → 一個 release 同時存在多個 wire 版本</text>
</svg>
